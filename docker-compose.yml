services:
  app:
    # build: .
    image: ghcr.io/nanogpt-community/nanochat:latest
    ports:
      - "3432:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - ORIGIN=${BETTER_AUTH_URL}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - DATABASE_URL=postgres://nanochat:${POSTGRES_PASSWORD}@db:5432/nanochat
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=nanochat
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nanochat
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanochat -d nanochat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
